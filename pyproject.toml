[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-in-the-sky"
version = "0.2.0"
description = "Local multicloud detection and threat hunting with reproducible evidence-backed evaluation"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6", "pytz==2026.4"]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.optional-dependencies]
dev = ["ruff==0.16.9"]

[project.scripts]
eits = "eits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eits = ["sql/*.sql", "rules/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
